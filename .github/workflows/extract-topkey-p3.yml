name: Extract TOPKEY P3 to review branch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-topkey-p3.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack and inspect the uploaded TOPKEY archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile
          import re

          archive = Path('TOPKEY_H120_BADMINTON_UNIFIED_AUTH_P3_REVIEW.zip')
          if not archive.is_file():
              raise SystemExit('Missing uploaded TOPKEY archive')
          dest = Path('topkey')
          dest.mkdir(exist_ok=True)
          count = 0
          excluded = []
          with ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = info.filename.replace('\\', '/')
                  parts = name.split('/')
                  if len(parts) < 2 or parts[0] != 'TOPKEY_H120_PRODUCTION':
                      raise SystemExit('Unexpected path in archive: '+name)
                  relative = Path(*parts[1:])
                  if (relative.is_absolute() or '..' in relative.parts or
                      any(p.startswith('.') for p in relative.parts) or
                      re.search(r'(credential|secret|service.?account|private.?key|token|\.pem$|\.key$|\.log$)', str(relative), re.I)):
                      excluded.append(str(relative))
                      continue
                  target = dest / relative
                  if target.resolve() != dest.resolve() and dest.resolve() not in target.resolve().parents:
                      raise SystemExit('Blocked unsafe path')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
                  count += 1
          if not (dest / 'index.html').is_file() or not (dest / 'sports/badminton/index.html').is_file():
              raise SystemExit('Required entrypoint missing')
          print('Extracted:', count, 'Excluded:', len(excluded))
          print('Excluded files:', ', '.join(excluded[:40]))
          PY
      - name: Make a separate review branch without the archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B topkey-p3-source
          git rm -f --ignore-unmatch TOPKEY_H120_BADMINTON_UNIFIED_AUTH_P3_REVIEW.zip
          git add topkey
          git commit -m "Extract TOPKEY H120 P3 source for review"
          git push --force-with-lease origin HEAD:refs/heads/topkey-p3-source
