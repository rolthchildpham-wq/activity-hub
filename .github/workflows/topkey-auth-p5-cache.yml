name: TOPKEY P5 Auth Cache
on:
  pull_request:
    paths:
      - 'topkey/sports/**/index.html'
      - 'topkey/sports/**/sw.js'
      - 'topkey/tests/auth-p5-cache.test.cjs'
      - '.github/workflows/topkey-auth-p5-cache.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node topkey/tests/auth-p5-cache.test.cjs
      - run: node topkey/tests/auth-profile-pending.test.cjs
      - run: node topkey/tests/badminton-auth-boot.test.cjs
