name: TOPKEY Chrome DevTools MCP full UI verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [rebuild/sports-hub-ecc-unified, fix/sports-hub-route-integrity, fix/hub-navigation-semantics-v2]
  workflow_run:
    workflows: ["TOPKEY EdgeOne Git-provider readiness"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Isolate each source revision so an older MCP build cannot hold the
# newest PR revision in a permanent pending queue. Duplicate events for the
# same SHA are coalesced; new commits always receive an independent run.
concurrency:
  group: topkey-chrome-devtools-mcp-v5-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  chrome-devtools-full-ui:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    name: Chrome DevTools MCP – Hub and 7 sports
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Serve checked-out branch locally for real browser verification
        id: fixture_server
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 topkey/tests/ui-fixture-server.py topkey > /tmp/topkey-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:4173/ >/dev/null

      - name: Build official Chrome DevTools MCP and connect a persistent MCP client
        id: mcp_bootstrap
        if: steps.fixture_server.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p .tools artifacts/chrome-devtools
          git clone https://github.com/ChromeDevTools/chrome-devtools-mcp.git .tools/chrome-devtools-mcp
          git -C .tools/chrome-devtools-mcp checkout 8c43179464d368a6a3c7f8ce2ee024e1e736b795
          echo "Official Chrome DevTools MCP commit: $(git -C .tools/chrome-devtools-mcp rev-parse HEAD)"
          npm ci --prefix .tools/chrome-devtools-mcp
          # Follow the official repository sync script. It initializes the
          # pinned frontend submodule and runs gclient-sync to fetch GN, Ninja
          # and the DEPS/CIPD inputs required by this source revision.
          cd .tools/chrome-devtools-mcp
          git submodule update --init
          node scripts/gclient-sync.ts
          npm run build
          cd "$GITHUB_WORKSPACE"
          test -x .tools/chrome-devtools-mcp/buildtools/linux64/gn
          test -x .tools/chrome-devtools-mcp/third_party/ninja/ninja
          test -f .tools/chrome-devtools-mcp/out/Default/gen/src/bin/chrome-devtools-mcp.js
          node topkey/tests/chrome-devtools-mcp-client.mjs daemon > /tmp/topkey-mcp-bridge.log 2>&1 &
          echo $! > /tmp/topkey-mcp-bridge.pid
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:4174/health >/dev/null; then break; fi
            if ! kill -0 "$(cat /tmp/topkey-mcp-bridge.pid)" 2>/dev/null; then
              cat /tmp/topkey-mcp-bridge.log
              exit 1
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:4174/health | tee artifacts/chrome-devtools/mcp-health.json
          cat /tmp/topkey-mcp-bridge.log | tee artifacts/chrome-devtools/mcp-bootstrap.log

      - name: Verify Hub desktop and mobile layout
        id: hub_ui
        if: steps.fixture_server.outcome == 'success' && steps.mcp_bootstrap.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          mcp_tool(){
            local status=0
            if node topkey/tests/chrome-devtools-mcp-client.mjs call "$@" 2>&1 | tee -a artifacts/chrome-devtools/mcp-tool-output.log; then
              return 0
            else
              status=$?
              printf 'MCP_TOOL_ERROR status=%s command=%q args=%q\\n' "$status" "$1" "${*:2}" | tee -a artifacts/chrome-devtools/mcp-errors.txt >&2
              return 0
            fi
          }
          base="http://127.0.0.1:4173"
          mcp_tool navigate_page 1 --url "$base/" | tee artifacts/chrome-devtools/hub-navigation.txt
          mcp_tool take_snapshot 1 --filePath artifacts/chrome-devtools/hub-desktop.txt >/dev/null
          sleep 2
          mcp_tool evaluate_script '() => {
            const cards=[...document.querySelectorAll("#topkey-sports .sport")];
            const result={url:location.href,title:document.title,sportCards:cards.length,
              badmintonCard:cards.some(card=>card.textContent.includes("Cầu lông")),
              navLinks:document.querySelectorAll(".tk210-nav a").length,
              overflow:document.documentElement.scrollWidth>innerWidth+2,
              canvaUi:[...document.styleSheets].some(sheet=>sheet.href?.includes("canva-ui-system.css")),
              legacyStyles:[...document.styleSheets].filter(sheet=>/upgrade|hub-|contrast|visual|dashboard-reference|ecc-design-system/i.test(sheet.href||"")).map(sheet=>sheet.href),
              hubController:window.TopkeyHubWorkspaceNav?.version==="H240",
              footerHidden:(()=>{const footer=document.querySelector(".footer");return !footer||getComputedStyle(footer).display==="none"})(),
              activeWorkspace:document.querySelector("main.wrap")?.dataset.activeWorkspace};
            const rgb=value=>value.match(/[\d.]+/g).slice(0,3).map(Number);
            const lum=value=>{const channels=rgb(value).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*channels[0]+.7152*channels[1]+.0722*channels[2]};
            const cardStyle=getComputedStyle(cards[0]),paragraphStyle=getComputedStyle(cards[0].querySelector("p"));
            const contrast=(Math.max(lum(cardStyle.backgroundColor),lum(paragraphStyle.color))+.05)/(Math.min(lum(cardStyle.backgroundColor),lum(paragraphStyle.color))+.05);
            const eccSheet=null;
            const eccRules=eccSheet?[...eccSheet.cssRules].filter(rule=>rule.selectorText?.includes("#topkey-sports")&&rule.selectorText.includes(".sport")).map(rule=>({selector:rule.selectorText,bg:rule.style.backgroundColor,priority:rule.style.getPropertyPriority("background-color")})):[];
            const lastCardRight=cards[cards.length-1].getBoundingClientRect().right;
            result.cardBackground=cardStyle.backgroundColor;result.cardText=paragraphStyle.color;result.cardContrast=Number(contrast.toFixed(2));
            const wrap=document.querySelector("body.tk-bi-hub .wrap"),wrapRect=wrap.getBoundingClientRect();
            const catalogRect=document.querySelector("#topkey-sports").getBoundingClientRect();
            result.lastCardRight=Math.round(lastCardRight);result.viewportWidth=innerWidth;
            result.wrapWidth=getComputedStyle(wrap).width;result.wrapMarginLeft=getComputedStyle(wrap).marginLeft;
            result.wrapPaddingRight=getComputedStyle(wrap).paddingRight;result.wrapRight=Math.round(wrapRect.right);
            result.catalogRight=Math.round(catalogRect.right);result.desktopBreakpoint=matchMedia("(min-width: 821px)").matches;
            result.bodyClass=document.body.className;result.catalogClass=document.querySelector("#topkey-sports").className;
            result.selectorMatches=document.querySelectorAll("html body.tk-bi-hub #topkey-sports.cards a.sport").length;
            result.cardInlineStyle=cards[0].getAttribute("style");result.cardBackgroundImage=cardStyle.backgroundImage;
            result.eccRuleCount=eccSheet?.cssRules?.length||0;result.eccRules=eccRules;
            if(cards.length<8||!result.badmintonCard||result.overflow||!result.canvaUi||result.legacyStyles.length||!result.hubController||!result.footerHidden||result.activeWorkspace!=="topkey-home"||cardStyle.backgroundColor==="rgb(255, 255, 255)"||
              contrast<4.5||lastCardRight>innerWidth-8)
              throw new Error("ECC Hub visual contract failed: "+JSON.stringify(result));
            return JSON.stringify(result);
          }' --pageId 1 --output-format=json | tee artifacts/chrome-devtools/hub-desktop.json
          if grep -q 'Error:' artifacts/chrome-devtools/hub-desktop.json; then failed=1; fi
          mcp_tool evaluate_script 'async () => {
            const wait=ms=>new Promise(resolve=>setTimeout(resolve,120));
            document.querySelector("#tk28-language-options [data-lang=\"vi\"]")?.click();
            await wait(180);
            const dashboard=window.TopkeyExecutiveDashboard,host=document.getElementById("executive-dashboard");
            if(!dashboard||!host)throw new Error("Executive dashboard runtime unavailable");
            window.TopkeyHubWorkspaceNav?.activate("executive-dashboard",{scroll:false});
            host.classList.remove("hidden");
            const clubs=[
              {icon:"🏸",name:"Cầu lông",sport:"Cầu lông",founded:2022,head:"Ban tổ chức",events:6,people:38,lastYear:2026,income:12000000,expense:8000000,balance:4000000,pending:1,active:true},
              {icon:"⚽",name:"Bóng đá",sport:"Bóng đá",founded:2023,head:"Ban tổ chức",events:4,people:26,lastYear:2026,income:8500000,expense:6200000,balance:2300000,pending:0,active:true},
              {icon:"🏐",name:"Bóng chuyền",sport:"Bóng chuyền",founded:2023,head:"Ban tổ chức",events:3,people:22,lastYear:2026,income:6000000,expense:4100000,balance:1900000,pending:0,active:true},
              {icon:"🏃",name:"Chạy bộ",sport:"Chạy bộ",founded:2024,head:"Ban tổ chức",events:2,people:18,lastYear:2026,income:3000000,expense:2500000,balance:500000,pending:0,active:true}
            ];
            const data={kpi:{clubs:7,events:18,uniquePeople:92,entries:180,income:29500000,expense:20800000,balance:8700000,pending:1},
              clubs,years:{"2025":{events:6,income:9000000,expense:6500000},"2026":{events:15,income:20500000,expense:14300000}},
              calendarEvents:[{date:"2026-11-25",time:"08:00",sport:"Cầu lông",icon:"🏸",title:"Giải đôi TOPKEY",status:"scheduled"},{date:"2026-11-25",time:"14:00",sport:"Bóng đá",icon:"⚽",title:"Giao hữu nội bộ",status:"scheduled"},{date:"2026-11-28",time:"09:00",sport:"Bóng chuyền",icon:"🏐",title:"Vòng bảng",status:"scheduled"}],
              champions:[{name:"Đội A",sport:"Cầu lông",category:"Đôi nam",tournament:"Giải đôi TOPKEY",year:2026}],
              events:[{sport:"Cầu lông",icon:"🏸",title:"Giải đôi TOPKEY",year:2026,income:12000000,expense:8000000,balance:4000000,pending:1}]};
            dashboard.render(data,{orgName:"TOPKEY · Chrome UI fixture",snapshotAt:Date.now()},"snapshot");
            for(let attempt=0;attempt<20&&!document.querySelector(".exec-insights-focus");attempt++)await wait(100);
            const focus=document.querySelector(".exec-insights-focus"),focusText=focus?.querySelector("p");
            const focusBg=focus?getComputedStyle(focus).backgroundColor:"";
            const focusColor=focusText?getComputedStyle(focusText).color:"";
            const rgb=value=>{const match=String(value||"").match(/[0-9.]+/g);return match&&match.length>=3?match.slice(0,3).map(Number):null};
            const lum=value=>{const channels=rgb(value);if(!channels)return 0;const linear=channels.map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*linear[0]+.7152*linear[1]+.0722*linear[2]};
            const insightContrast=focusText?(Math.max(lum(focusBg),lum(focusColor))+.05)/(Math.min(lum(focusBg),lum(focusColor))+.05):0;
            const result={languageModalClosed:document.querySelector("#tk28-language-modal")?.classList.contains("tk28-hidden")!==false,
              calendar:!!document.querySelector(".exec-calendar-card"),chartBars:document.querySelectorAll(".exec-bar-row").length,
              kpiCards:document.querySelectorAll(".exec-kpi").length,calendarCells:document.querySelectorAll(".exec-calendar-day:not(.is-empty)").length,
              insightContrast:Number(insightContrast.toFixed(2)),insightBackground:focusBg,insightText:focusColor};
            if(!result.calendar||result.chartBars<2||result.kpiCards<4||!focus||insightContrast<4.5)
              throw new Error("Hub dashboard fixture/contrast incomplete: "+JSON.stringify(result));
            return JSON.stringify(result);
          }' --pageId 1 --output-format=json | tee artifacts/chrome-devtools/hub-dashboard-fixture.json
          if grep -q 'Error:' artifacts/chrome-devtools/hub-dashboard-fixture.json; then failed=1; fi
          mcp_tool take_screenshot 1 --filePath artifacts/chrome-devtools/hub-desktop.png
          mcp_tool take_snapshot 1 --filePath artifacts/chrome-devtools/hub-desktop-after-dashboard.txt >/dev/null
          mcp_tool evaluate_script '() => {document.querySelector("#executive-dashboard")?.scrollIntoView({block:"start"});return "dashboard-scrolled"}' --pageId 1
          mcp_tool take_screenshot 1 --filePath artifacts/chrome-devtools/hub-dashboard-ui-fixture.png
          mcp_tool evaluate_script '() => {window.scrollTo(0,0);return "top"}' --pageId 1
          mcp_tool resize_page 1 390 844
          mcp_tool evaluate_script '() => {
            const catalog=document.querySelector("#topkey-sports");
            const tableWraps=[...document.querySelectorAll(".exec-table-wrap,.exec-insights-tablewrap")];
            const result={width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
              overflow:document.documentElement.scrollWidth>innerWidth+2,
              navPosition:getComputedStyle(document.querySelector(".tk210-nav")).position,
              catalogColumns:getComputedStyle(catalog).gridTemplateColumns.split(" ").length,
              catalogOverflow:catalog.scrollWidth>catalog.clientWidth+2,
              tableOverflow:tableWraps.filter(node=>node.scrollWidth>node.clientWidth+2).length,
              tableCount:tableWraps.length};
            const navRect=document.querySelector(".tk210-nav").getBoundingClientRect();
            const heroRect=document.querySelector(".tk-bi-hero").getBoundingClientRect();
            result.navTop=Math.round(navRect.top);result.heroBottom=Math.round(heroRect.bottom);
            const calendar=document.querySelector(".exec-calendar-card");
            const calendarGrid=document.querySelector(".exec-calendar-grid");
            const weekdays=document.querySelector(".exec-calendar-weekdays");
            if(!calendar||!calendarGrid||!weekdays)
              throw new Error("Hub dashboard calendar fixture missing on mobile");
            const calendarRect=calendar.getBoundingClientRect();
            const gridRect=calendarGrid.getBoundingClientRect();
            const weekdayRect=weekdays.getBoundingClientRect();
            result.calendar={cardWidth:Math.round(calendarRect.width),cardClientWidth:calendar.clientWidth,
              cardScrollWidth:calendar.scrollWidth,gridWidth:Math.round(gridRect.width),
              gridClientWidth:calendarGrid.clientWidth,gridScrollWidth:calendarGrid.scrollWidth,
              gridMinWidth:getComputedStyle(calendarGrid).minWidth,
              weekdaysWidth:Math.round(weekdayRect.width),weekdaysScrollWidth:weekdays.scrollWidth,
              columns:getComputedStyle(calendarGrid).gridTemplateColumns};
            if(result.overflow||result.navPosition!=="fixed"||navRect.top<heroRect.bottom||
              result.catalogColumns!==4||result.catalogOverflow||result.tableOverflow)
              throw new Error("Hub mobile navigation/catalog/table overflow failed: "+JSON.stringify(result));
            if(calendar.scrollWidth>calendar.clientWidth+1||
              calendarGrid.scrollWidth>calendarGrid.clientWidth+1||
              weekdays.scrollWidth>weekdays.clientWidth+1||
              calendarRect.width>innerWidth-16||
              getComputedStyle(calendarGrid).minWidth!=="0px")
              throw new Error("H220 mobile calendar horizontal overflow: "+JSON.stringify(result));
            return JSON.stringify(result);
          }' --pageId 1 --output-format=json | tee artifacts/chrome-devtools/hub-mobile.json
          mcp_tool take_screenshot 1 --filePath artifacts/chrome-devtools/hub-mobile.png
          mcp_tool take_snapshot 1 --filePath artifacts/chrome-devtools/hub-mobile.txt >/dev/null
          mcp_tool evaluate_script '() => {document.querySelector(".exec-calendar-card")?.scrollIntoView({block:"center"});return "calendar-mobile-scrolled"}' --pageId 1
          mcp_tool take_screenshot 1 --filePath artifacts/chrome-devtools/hub-calendar-mobile.png
          mcp_tool resize_page 1 1440 1000
          if [ "$failed" -ne 0 ] || grep -R -q 'MCP_TOOL_ERROR' artifacts/chrome-devtools; then
            echo "Hub UI checks completed with one or more recorded failures; see hub-desktop/dashboard/mobile artifacts."
            exit 1
          fi

      - name: Full UI fixture and interaction matrix – all 7 sports
        id: sports_ui
        if: steps.fixture_server.outcome == 'success' && steps.mcp_bootstrap.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          mkdir -p artifacts/chrome-devtools
          # A single failed MCP interaction must be recorded, not terminate the matrix.
          # The outer GitHub bash shell enables errexit, so guard every client invocation.
          mcp_tool(){
            local status=0
            if node topkey/tests/chrome-devtools-mcp-client.mjs call "$@"; then
              return 0
            else
              status=$?
              printf 'MCP_TOOL_ERROR status=%s command=%q args=%q\\n' "$status" "$1" "${*:2}" | tee -a artifacts/chrome-devtools/mcp-errors.txt >&2
              return 0
            fi
          }
          base="http://127.0.0.1:4173"
          sports=(football volleyball running handmade shuttle cooking badminton)
          tabs=(overview control teams schedule umpire live finance announcements audit health settings)
          for sport in "${sports[@]}"; do
            if [ "$sport" = "badminton" ]; then
              route="/sports/vnext/badminton.html?testlab=1&tid=__testlab_u122_20261031_badminton_chromeqa&v=h219-liberty-dashboard-20261125&__topkey_reload=h219"
            else
              route="/sports/vnext/index.html?sport=$sport&testlab=1&tid=__testlab_u122_20261031_${sport}_chromeqa&v=h219-liberty-dashboard-20261125&__topkey_reload=h219"
            fi
            echo "===== $sport =====" | tee -a artifacts/chrome-devtools/sport-matrix.txt
            mcp_tool navigate_page 1 --url "$base$route" | tee "artifacts/chrome-devtools/$sport-navigation.txt"
            sleep 2
            mcp_tool evaluate_script 'async () => {
              const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
              const T=window.Topkey;
              if(!window.TopkeyPlatform)throw new Error("Shared platform bootstrap unavailable");
              // Isolated UI fixture only: explicitly release the core-loader gate.
              // No Firebase sign-in, role write, form submission or business-data mutation.
              window.__TOPKEY_ADMIN_READY=true;
              window.dispatchEvent(new Event("topkey:admin-ready"));
              let A=null;
              for(let attempt=0;attempt<80;attempt++){
                A=window.Topkey?.App||null;
                if(A&&window.Topkey?.Auth)break;
                await wait(250);
              }
              if(!A||!window.Topkey?.Auth)throw new Error("Application modules not ready: "+JSON.stringify({
                platform:!!window.TopkeyPlatform,topkey:!!window.Topkey,
                sport:window.Topkey?.SPORT?.key,auth:!!window.Topkey?.Auth,
                adminReady:window.__TOPKEY_ADMIN_READY,bootError:window.__TOPKEY_BOOT_ERROR,
                installError:window.__TOPKEY_H227_INSTALL_ERROR||null,
                scripts:[...document.scripts].filter(s=>s.src).map(s=>({src:s.src,loaded:!!s.dataset.topkeyReady}))
              }));
              await A.__bootPromise?.catch(error=>{throw error});
              // Strictly isolate UI QA from the linked production Firebase database.
              // The admin fixture remains enabled, but every code path sees no writable DB.
              if(T.Data){T.Data.db=null;T.Data.ready=false;T.Data.connected=false;}
              window.__TOPKEY_QA_FIREBASE_DISABLED=!T.Data?.db;
              T.Auth.can=()=>true;
              T.Auth.role=()=>"ADMIN";
              T.Auth.profile={role:"ADMIN",displayName:"Chrome QA fixture"};
              window.__TOPKEY_QA_WRITE_ATTEMPTS=0;
              for(const method of ["queueSet","queueMulti","audit"]){
                if(typeof T.Data?.[method]==="function")T.Data[method]=async()=>{window.__TOPKEY_QA_WRITE_ATTEMPTS++;return null};
              }
              document.querySelector("#login-screen")?.classList.add("hidden");
              document.querySelector("#app-shell")?.classList.remove("hidden");
              A.setupUI?.();
              document.querySelectorAll("#app-shell [data-tab]").forEach(button=>button.classList.remove("hidden"));
              A.renderAll?.();
              A.showTab("overview");
              const sport=new URLSearchParams(location.search).get("sport")||(location.pathname.endsWith("/badminton.html")||location.pathname.includes("/sports/badminton/")?"badminton":"");
              const expectedIdentity={football:"FOOTBALL OPERATIONS",volleyball:"VOLLEYBALL ARENA",running:"RACE CONTROL",handmade:"MAKERS STUDIO",shuttle:"SHUTTLECOCK",cooking:"CULINARY STUDIO",badminton:"BADMINTON ARENA"}[sport];
              const navIdentity=getComputedStyle(document.querySelector("#app-shell .nav"),"::before").content;
              if(!expectedIdentity||!navIdentity.includes(expectedIdentity))
                throw new Error("Sport identity mismatch: "+JSON.stringify({sport,expectedIdentity,navIdentity,htmlSport:document.documentElement.dataset.tkSport}));
              const gridColumns=grid=>{
                const value=grid?getComputedStyle(grid).gridTemplateColumns:"";
                const repeat=value.match(/^repeat\((\d+),/);
                return {count:repeat?Number(repeat[1]):value.trim().split(/\s+/).length,value};
              };
              const panel=document.querySelector("#h201-analytics .h201-panel");
              const heading=panel?.querySelector("h2"),sub=panel?.querySelector(".h201-sub");
              const rgb=value=>value.match(/[\d.]+/g).slice(0,3).map(Number);
              const lum=value=>{const channels=rgb(value).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*channels[0]+.7152*channels[1]+.0722*channels[2]};
              const contrast=(a,b)=>(Math.max(lum(a),lum(b))+.05)/(Math.min(lum(a),lum(b))+.05);
              let dashboardFixture=null;
              if(sport==="volleyball"){
                A.state.config={title:"QA Volleyball · NAM_6V6",format:"GROUP_KNOCKOUT",rules:{bestOf:5,points:25,decidingPoints:15,winBy:2,cap:99,minRestMinutes:60,estimatedMatchMinutes:75}};
                A.state.teams={qaA:{id:"qaA",name:"Đội A"},qaB:{id:"qaB",name:"Đội B"}};
                A.state.courts={qaCourt:{id:"qaCourt",name:"Sân 1"}};
                A.state.matches={qaMatch:{id:"qaMatch",code:"QA-01",teamAId:"qaA",teamBId:"qaB",category:"NAM_6V6",stage:"GROUP",groupName:"A",date:"2026-11-25",time:"19:30",courtId:"qaCourt",status:"LIVE",sets:[]}};
                A.state.activeMatches={qaCourt:{matchId:"qaMatch",started:true,finished:false,sets:[{a:12,b:10}],setIndex:0}};
                for(let attempt=0;attempt<150&&!window.TopkeyDashboardH227;attempt++)await new Promise(resolve=>setTimeout(resolve,100));
                if(!window.TopkeyDashboardH227)throw new Error("H227 dashboard runtime unavailable after 15s: "+JSON.stringify({
                  script:[...document.scripts].filter(x=>x.src.includes("dashboard-live-h227")).map(x=>({src:x.src,readyState:x.readyState})),
                  publicRoute:window.__TOPKEY_PUBLIC_ROUTE||false,installed:!!window.Topkey?.App?.__h227,
                  bootError:window.__TOPKEY_BOOT_ERROR||null,app:!!window.Topkey?.App,renderBranch:typeof window.Topkey?.App?.renderBranch
                }));
                window.TopkeyDashboardH227.render();
                const board=document.querySelector("#tk227-board"),cards=board?.querySelectorAll(".tk227-match")||[];
                const text=board?.textContent||"",adminCard=document.querySelector("#page-overview>.grid.g2>.card");
                const adminBg=adminCard?getComputedStyle(adminCard).backgroundColor:"";
                const adminHeading=adminCard?.querySelector("h2"),adminText=adminHeading?getComputedStyle(adminHeading).color:"";
                dashboardFixture={board:!!board,matchCards:cards.length,hasTeam:text.includes("Đội A")&&text.includes("Đội B"),
                  hasLiveScore:text.includes("12 - 10"),hasCategory:text.includes("NAM_6V6"),
                  hasCourt:text.includes("Sân 1"),hasSetRules:text.includes("Tối đa 5 set")&&text.includes("Set quyết định: 15 điểm"),
                  adminBackground:adminBg,adminHeadingColor:adminText,
                  adminContrast:adminHeading?Number(contrast(adminBg,adminText).toFixed(2)):0};
                if(!dashboardFixture.board||!dashboardFixture.matchCards||!dashboardFixture.hasTeam||
                  !dashboardFixture.hasLiveScore||!dashboardFixture.hasCategory||!dashboardFixture.hasCourt||
                  !dashboardFixture.hasSetRules||dashboardFixture.adminContrast<4.5)
                  throw new Error("H227 volleyball dashboard fixture failed: "+JSON.stringify(dashboardFixture));
                A.state.config=A.state.config||{};
                A.state.config.scheduleGroups={NAM_6V6:{format:"GROUP",entries:[
