      - name: Production HTTP and asset checks (collect every endpoint)
        id: production
        if: always()
        continue-on-error: true
        shell: bash
        env:
          MCP_BOOTSTRAP_OUTCOME: ${{ steps.mcp_bootstrap.outcome }}
        run: |
          set -uo pipefail
          mkdir -p artifacts/chrome-devtools
          failed=0
          base="https://topkey-activity-management.edgeone.dev"
          paths=("/" "/sports/vnext/index.html?sport=football" "/sports/vnext/index.html?sport=volleyball" "/sports/vnext/badminton.html" "/sports/badminton/index.html" "/hub-dashboard-reference-h219.css" "/executive-dashboard.js?v=h232-live-schedule-20261126")
          for path in "${paths[@]}"; do
            code="000"
            for attempt in 1 2 3 4; do
              code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$base$path" || true)"
              if [ "$code" = "200" ]; then break; fi
              sleep 2
            done
            echo "$code $path" | tee -a artifacts/chrome-devtools/http-status.txt
            if [ "$code" != "200" ]; then failed=1; fi
          done

          if curl --fail --silent --show-error --location "$base/sports/vnext/index.html?sport=volleyball&__topkey_probe=$GITHUB_RUN_ID" -o /tmp/topkey-live-index.html; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && grep -Fq "workspace-contrast-runtime-h238.js?v=h251-podium-medal-unconditional-aa-20261127" /tmp/topkey-live-index.html 2>/dev/null; then
              if curl --fail --silent --show-error --location "$base/sports/vnext/index.html?sport=volleyball&__h248_probe=$GITHUB_RUN_ID" -o /tmp/topkey-h248-live.html &&
                 grep -Fq 'workspace-contrast-runtime-h238.js?v=h251-podium-medal-unconditional-aa-20261127' /tmp/topkey-h248-live.html; then
                echo "200 H251 production HTML verified" | tee -a artifacts/chrome-devtools/http-status.txt
              else
                echo "FAIL H251 production HTML content" | tee -a artifacts/chrome-devtools/http-status.txt
                failed=1
              fi
              if curl --fail --silent --show-error --location "$base/sports/vnext/workspace-contrast-runtime-h238.js?v=h251-podium-medal-unconditional-aa-20261127" -o /tmp/topkey-h248-live.js &&
                 grep -Fq 'h251-podium-medal-unconditional-aa-20261127' /tmp/topkey-h248-live.js; then
                echo "200 H251 production runtime content verified" | tee -a artifacts/chrome-devtools/http-status.txt
              else
                echo "FAIL H251 production runtime content" | tee -a artifacts/chrome-devtools/http-status.txt
                failed=1
              fi

              # Verify deployed production runtime only through official MCP.
              if [ "$MCP_BOOTSTRAP_OUTCOME" = "success" ]; then
                mcp_tool(){
                  local status=0
                  if node topkey/tests/chrome-devtools-mcp-client.mjs call "$@" 2>&1 | tee -a artifacts/chrome-devtools/mcp-tool-output.log; then return 0; else status=$?; printf 'MCP_TOOL_ERROR status=%s command=%q args=%q\\n' "$status" "$1" "${*:2}" | tee -a artifacts/chrome-devtools/mcp-errors.txt >&2; return 0; fi
                }
                mcp_tool navigate_page 2 --url "$base/sports/vnext/index.html?sport=volleyball&__h248_live=$GITHUB_RUN_ID" | tee artifacts/chrome-devtools/h248-production-navigation.txt
                sleep 2
                mcp_tool evaluate_script 'async () => {
                  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
                  for(let i=0;i<40&&!window.__TOPKEY_WORKSPACE_CONTRAST_H251;i++)await wait(100);
                  const runtime=window.__TOPKEY_WORKSPACE_CONTRAST_H251;
                  if(!runtime)throw new Error("H251 runtime not loaded on live EdgeOne");
                  const host=document.querySelector("#app-shell");
                  if(!host)throw new Error("Live sports workspace root unavailable");
                  const page=document.createElement("section");
                  page.className="page";page.style.backgroundColor="rgb(255,255,255)";
                  const sample=document.createElement("span");sample.textContent="H251 production contrast smoke test";sample.style.color="rgb(181,211,232)";
                  page.appendChild(sample);host.appendChild(page);await wait(150);
                  const foreground=getComputedStyle(sample).color,background=getComputedStyle(page).backgroundColor;
                  const rgb=value=>String(value).match(/[0-9.]+/g).slice(0,3).map(Number);
                  const lum=value=>{const c=rgb(value).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
                  const ratio=(Math.max(lum(foreground),lum(background))+.05)/(Math.min(lum(foreground),lum(background))+.05);
                  page.remove();const result={runtime:runtime.version,foreground,background,contrast:Number(ratio.toFixed(2))};
                  if(foreground!=="rgb(41, 70, 91)"||ratio<4.5)throw new Error("H251 live production contrast failed: "+JSON.stringify(result));
