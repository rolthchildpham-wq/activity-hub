name: TOPKEY Chrome DevTools MCP full UI verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TOPKEY EdgeOne Git-provider readiness"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: topkey-chrome-devtools-mcp-v4
  cancel-in-progress: false

jobs:
  chrome-devtools-full-ui:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Chrome DevTools MCP – Hub and 7 sports
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official Chrome DevTools MCP CLI
        run: |
          npm install --global chrome-devtools-mcp@latest
          chrome-devtools --help

      - name: Start isolated Chrome
        run: |
          set -euo pipefail
          chrome-devtools start --headless --isolated --no-usage-statistics --workspace="$GITHUB_WORKSPACE"
          chrome-devtools status
          mkdir -p artifacts/chrome-devtools

      - name: Verify Hub desktop and mobile layout
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          chrome-devtools navigate_page 1 --url "$base/" | tee artifacts/chrome-devtools/hub-navigation.txt
          sleep 2
          chrome-devtools evaluate_script '() => {
            const cards=[...document.querySelectorAll("#topkey-sports .sport")];
            const result={url:location.href,title:document.title,sportCards:cards.length,
              badmintonCard:cards.some(card=>card.textContent.includes("Cầu lông")),
              navLinks:document.querySelectorAll(".tk210-nav a").length,
              overflow:document.documentElement.scrollWidth>innerWidth+2,
              h219:[...document.styleSheets].some(sheet=>sheet.href?.includes("hub-dashboard-reference-h219.css"))};
            if(cards.length<8||!result.badmintonCard||result.overflow||!result.h219)
              throw new Error("H219 Hub contract failed: "+JSON.stringify(result));
            return JSON.stringify(result);
          }' --pageId 1 --output-format=json | tee artifacts/chrome-devtools/hub-desktop.json
          chrome-devtools take_screenshot 1 --filePath artifacts/chrome-devtools/hub-desktop.png
          chrome-devtools resize_page 1 --width 390 --height 844
          chrome-devtools evaluate_script '() => {
            const result={width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
              overflow:document.documentElement.scrollWidth>innerWidth+2,
              navPosition:getComputedStyle(document.querySelector(".tk210-nav")).position};
            if(result.overflow)throw new Error("Hub mobile overflow: "+JSON.stringify(result));
            return JSON.stringify(result);
          }' --pageId 1 --output-format=json | tee artifacts/chrome-devtools/hub-mobile.json
          chrome-devtools take_screenshot 1 --filePath artifacts/chrome-devtools/hub-mobile.png
          chrome-devtools resize_page 1 --width 1440 --height 1000

      - name: Full UI fixture and interaction matrix – all 7 sports
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          sports=(football volleyball running handmade shuttle cooking badminton)
          tabs=(overview control teams schedule umpire live finance announcements audit health settings)
          for sport in "${sports[@]}"; do
            if [ "$sport" = "badminton" ]; then
              route="/sports/vnext/badminton.html?testlab=1&v=h219-liberty-dashboard-20261125&__topkey_reload=h219"
            else
              route="/sports/vnext/index.html?sport=$sport&testlab=1&v=h219-liberty-dashboard-20261125&__topkey_reload=h219"
            fi
            echo "===== $sport =====" | tee -a artifacts/chrome-devtools/sport-matrix.txt
            chrome-devtools navigate_page 1 --url "$base$route" | tee "artifacts/chrome-devtools/$sport-navigation.txt"
            sleep 2
            chrome-devtools evaluate_script '() => {
              const T=window.Topkey,A=T?.App;
              if(!A||!T?.Auth)throw new Error("Application modules not ready");
              // UI-only fixture: grant client-side tab visibility in this isolated browser.
              // No form submission, Firebase write, role persistence or real account mutation.
              T.Auth.can=()=>true;
              T.Auth.role=()=>"ADMIN";
              T.Auth.profile={role:"ADMIN",displayName:"Chrome QA fixture"};
              T.Auth.user={uid:"chrome-ui-fixture",email:"chrome-ui-fixture@example.invalid"};
              document.querySelector("#login-screen")?.classList.add("hidden");
              document.querySelector("#app-shell")?.classList.remove("hidden");
              A.setupUI?.();
              document.querySelectorAll("#app-shell [data-tab]").forEach(button=>button.classList.remove("hidden"));
              A.renderAll?.();
              A.showTab("overview");
              const sport=new URLSearchParams(location.search).get("sport")||(location.pathname.includes("/sports/badminton/")?"badminton":"");
              const result={url:location.href,sport,appReady:true,
                pageCount:document.querySelectorAll("#app-shell .page").length,
                tabCount:document.querySelectorAll("#app-shell [data-tab]").length,
                collapsible:!!window.TopkeyCollapsibleH141,
                enginePath:location.pathname,
                fixture:"UI_ONLY_NO_DATABASE_WRITES"};
              if(result.pageCount<11||result.tabCount<11)throw new Error("Incomplete sport workspace: "+JSON.stringify(result));
              if(sport==="badminton"&&!location.pathname.includes("/sports/badminton/index.html"))
                throw new Error("Shared badminton launcher did not reach badminton engine: "+JSON.stringify(result));
              return JSON.stringify(result);
            }' --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/$sport-boot.json"
            if grep -q 'Error:' "artifacts/chrome-devtools/$sport-boot.json"; then exit 1; fi
            grep -q 'UI_ONLY_NO_DATABASE_WRITES' "artifacts/chrome-devtools/$sport-boot.json"
            for tab in "${tabs[@]}"; do
              script="async () => {
                const wait=ms=>new Promise(resolve=>setTimeout(resolve,120));
                const button=document.querySelector('#app-shell [data-tab=\"$tab\"]');
                if(!button)throw new Error('Missing tab $tab');
                button.click();await wait(220);
                const page=document.getElementById('page-$tab');
                const active=[...document.querySelectorAll('#app-shell .page')].filter(item=>!item.classList.contains('hidden'));
                if(!page||page.classList.contains('hidden')||active.length!==1)
                  throw new Error('Tab activation failed $tab: '+JSON.stringify(active.map(item=>item.id)));
                return JSON.stringify({tab:'$tab',activePage:page.id,
                  visibleCards:page.querySelectorAll('.card,.subcard').length});
              }"
              chrome-devtools evaluate_script "$script" --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/$sport-tab-$tab.json"
              if grep -q 'Error:' "artifacts/chrome-devtools/$sport-tab-$tab.json"; then exit 1; fi
              grep -q "page-$tab" "artifacts/chrome-devtools/$sport-tab-$tab.json"
              chrome-devtools take_screenshot 1 --filePath "artifacts/chrome-devtools/$sport-tab-$tab.png" >/dev/null
            done
            chrome-devtools evaluate_script 'async () => {
              const wait=ms=>new Promise(resolve=>setTimeout(resolve,120));
              const page=document.getElementById("page-settings");
              const fixture=document.createElement("section");
              fixture.className="subcard";
              fixture.innerHTML="<h3>Chrome QA accordion fixture</h3><p>Temporary UI-only content. No business data.</p>";
              page.appendChild(fixture);
              await wait(250);
              if(!window.TopkeyCollapsibleH141)throw new Error("Collapsible runtime not initialized");
              const toggle=fixture.querySelector(":scope > .tk141-panel-toggle");
              if(!toggle)throw new Error("Nested card did not receive a toggle");
              const initial=fixture.classList.contains("tk141-panel-folded");
              toggle.click();await wait();
              const changed=fixture.classList.contains("tk141-panel-folded")!==initial;
              if(!changed||toggle.getAttribute("aria-expanded")!==String(initial))
                throw new Error("Nested card did not change state");
              toggle.click();await wait();
              const restored=fixture.classList.contains("tk141-panel-folded")===initial;
              if(!restored)throw new Error("Nested card did not restore original state");
              fixture.remove();
              return JSON.stringify({collapseExpand:"PASS",restored:true,ariaExpanded:"accessible",fixture:"UI_ONLY"});
            }' --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/$sport-accordion.json"
            if grep -q 'Error:' "artifacts/chrome-devtools/$sport-accordion.json"; then exit 1; fi
            grep -q 'collapseExpand' "artifacts/chrome-devtools/$sport-accordion.json"
            chrome-devtools resize_page 1 390 844
            chrome-devtools evaluate_script '() => {
              const result={width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                overflow:document.documentElement.scrollWidth>innerWidth+2};
              if(result.overflow)throw new Error("Mobile horizontal overflow: "+JSON.stringify(result));
              return JSON.stringify(result);
            }' --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/$sport-mobile.json"
            if grep -q 'Error:' "artifacts/chrome-devtools/$sport-mobile.json"; then exit 1; fi
            chrome-devtools take_screenshot 1 --filePath "artifacts/chrome-devtools/$sport-mobile.png" >/dev/null
            chrome-devtools resize_page 1 1440 1000
            chrome-devtools list_console_messages 1 --output-format=json > "artifacts/chrome-devtools/$sport-console.json" || true
            chrome-devtools list_network_requests 1 --output-format=json > "artifacts/chrome-devtools/$sport-network.json" || true
          done

      - name: Production HTTP and asset checks
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          paths=("/" "/sports/vnext/index.html?sport=football" "/sports/vnext/badminton.html" "/sports/badminton/index.html" "/hub-dashboard-reference-h219.css" "/executive-dashboard.js?v=h219-calendar-20261125")
          for path in "${paths[@]}"; do
            code="$(curl --silent --show-error --location --max-time 25 -o /dev/null -w '%{http_code}' "$base$path" || true)"
            echo "$code $path" | tee -a artifacts/chrome-devtools/http-status.txt
            test "$code" = "200"
          done

      - name: Run regression tests
        run: |
          set -euo pipefail
          node topkey/tests/hub-dashboard-h219.test.cjs
          node topkey/tests/hub-readable-h216.test.cjs
          node topkey/tests/sport-contrast-h217.test.cjs
          node topkey/tests/sport-workspace-redesign-h218.test.cjs
          node topkey/tests/sport-workspaces-ux-h214.test.cjs
          node topkey/tests/sport-themes-h132.test.cjs
          node topkey/tests/badminton-dashboard-smooth-h129.test.cjs
          node topkey/tests/hub-sidebar-full-patch-h130.test.cjs
          node topkey/tests/short-public-links-h136.test.cjs

      - name: Upload Chrome DevTools evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topkey-chrome-devtools-h219-full-audit
          path: artifacts/chrome-devtools/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Chrome DevTools MCP
        if: always()
        run: chrome-devtools stop || true
