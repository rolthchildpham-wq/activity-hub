                const surfaceSelector='.card,.subcard,.tk9-card,.tk9-count,.control-card,.court-card,.list-card,.checkin-row,.team-picker,.team-pick,.check-option,.rule-chip,.schedule-preview,.table-wrap,.modal-box,.tk-group-standings,.tk227-match,.tk227-rule,.official-score .side,.score-head>div,.video-box,.radio-row,.danger-check,.delete-preview,.mode-note,.tk152-panel,#tk79-prize-editor,.tk79-prize-row';
                const textSelector='h1,h2,h3,h4,p,small,label,strong,b,span,em,li,td,th,div.muted,div.note,div.hint,div.description';
                const rgb=value=>{const m=String(value||'').match(/[\\d.]+/g);return m&&m.length>=3?m.slice(0,3).map(Number):null};
                const lum=value=>{const v=rgb(value);if(!v)return 0;const a=v.map(n=>{n/=255;return n<=.04045?n/12.92:Math.pow((n+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};
                const ratio=(bg,fg)=>(Math.max(lum(bg),lum(fg))+.05)/(Math.min(lum(bg),lum(fg))+.05);
                const failures=[];let minContrast=99,samples=0;
