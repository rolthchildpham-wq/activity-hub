            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Production HTTP/asset audit completed all endpoints and recorded one or more failures."
            exit 1
          fi
      - name: Run full source syntax and regression audit (collect every failure)
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/chrome-devtools/regression
          report="artifacts/chrome-devtools/regression/summary.tsv"
          : > "$report"
          total=0
          passed=0
          failed=0
          skipped=0
          run_check(){
            local name="$1"; shift
            local log="artifacts/chrome-devtools/regression/${name//[^A-Za-z0-9_.-]/_}.log"
            total=$((total+1))
            echo "===== START $name ====="
            if timeout 30s "$@" >"$log" 2>&1; then
              passed=$((passed+1))
              printf 'PASS\t%s\t0\n' "$name" | tee -a "$report"
              echo "PASS $name"
            else
              local code=$?
              failed=$((failed+1))
              printf 'FAIL\t%s\t%s\n' "$name" "$code" | tee -a "$report"
              echo "FAIL $name (exit $code); continuing. Log: $log"
              sed -n '1,100p' "$log"
            fi
          }

          # The staging contract tests require the same real SvelteKit build
          # and composed EdgeOne artifact as next-ui-validation; prepare them
          # before the complete Node suite rather than treating absent outputs
          # as product regressions.
          run_check "edgeone-next-build-and-stage" bash -c '
            set -euo pipefail
            cd next-ui
            npm install --no-audit --no-fund
            npx svelte-kit sync
            npm run check
            npm run build
            cd ..
            node scripts/stage-edgeone-next.mjs
          '
          run_check "install-isolated-jsdom" npm install --prefix /tmp/topkey-tests --no-audit --no-fund jsdom@26
          export NODE_PATH="/tmp/topkey-tests/node_modules${NODE_PATH:+:$NODE_PATH}"
          export TOPKEY_TEST_NODE_MODULES=/tmp/topkey-tests/node_modules

          # Parse every first-party JS/CJS/MJS source file. Do not stop at the
          # first syntax error; record each broken file and continue scanning.
          while IFS= read -r file; do
            run_check "syntax-$file" node --check "$file"
          done < <(find . -type d \( -name node_modules -o -name vendor -o -name .git -o -name .next -o -name .tools -o -name dist -o -name dist-edgeone \) -prune -o -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print | sort)

          # Execute the complete Node regression suite as one TAP run.
          # node --test continues after individual assertion failures and emits
          # every failing subtest; this avoids serial 30s waits per test file.
          mapfile -t test_files < <(find . -type d \( -name node_modules -o -name vendor -o -name .git -o -name .next -o -name .tools -o -name dist -o -name dist-edgeone \) -prune -o -type f \( -name '*.test.cjs' -o -name '*.test.mjs' -o -name '*.test.js' \) -print | sort)
          runnable_tests=()
          for file in "${test_files[@]}"; do
            case "$file" in
              *rules-emulator*.test.cjs|*rules-emulator*.test.mjs|*rules-emulator*.test.js)
                skipped=$((skipped+1))
                printf 'DEFERRED\\t%s\\tFirebase emulator gate\\n' "$file" | tee -a "$report"
                ;;
              *) runnable_tests+=("$file") ;;
            esac
          done
          total=$((total+1))
          node_log="artifacts/chrome-devtools/regression/all-node-tests.tap"
          echo "Running ${#runnable_tests[@]} Node test files in one failure-collecting TAP session."
          if timeout 180s node --test --test-concurrency=8 "${runnable_tests[@]}" >"$node_log" 2>&1; then
            node_failed=0
          else
            node_failed=$?
          fi
          node_passed=$(grep -c '^ok ' "$node_log" || true)
          node_not_ok=$(grep -c '^not ok ' "$node_log" || true)
          if [ "$node_failed" -eq 0 ]; then
            passed=$((passed+1))
            printf 'PASS\\tall-node-regression-tests (%s files; %s subtests)\\t0\\n' "${#runnable_tests[@]}" "$node_passed" | tee -a "$report"
          else
            failed=$((failed+1))
            printf 'FAIL\\tall-node-regression-tests (%s files; %s failed subtests)\\t%s\\n' "${#runnable_tests[@]}" "$node_not_ok" "$node_failed" | tee -a "$report"
            echo "Node regression suite returned $node_failed; all TAP failures are listed below."
            grep -n -A8 -B2 '^not ok ' "$node_log" || true
            tail -n 80 "$node_log"
          fi

          # Compile every Python source without writing __pycache__ files.
          while IFS= read -r file; do
            run_check "python-$file" python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); compile(p.read_text(encoding="utf-8"),str(p),"exec")' "$file"
          done < <(find . -type d \( -name node_modules -o -name vendor -o -name .git -o -name .next -o -name .tools -o -name dist -o -name dist-edgeone \) -prune -o -type f -name '*.py' -print | sort)

          printf '\nTOTAL=%s PASS=%s FAIL=%s DEFERRED=%s\n' "$total" "$passed" "$failed" "$skipped" | tee artifacts/chrome-devtools/regression/totals.txt
          if [ "$failed" -ne 0 ]; then
            echo "Full regression audit found $failed failing checks; all discovered checks were still executed."
            exit 1
          fi
          echo "All executable source and regression checks passed (emulator rules remain under dedicated gate)."
      - name: Upload Chrome DevTools evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topkey-chrome-devtools-h219-full-audit
          path: artifacts/chrome-devtools/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop persistent MCP client and official server
        if: always()
        run: |
          if [ -f /tmp/topkey-mcp-bridge.pid ]; then
            kill "$(cat /tmp/topkey-mcp-bridge.pid)" 2>/dev/null || true
          fi
          cat /tmp/topkey-mcp-bridge.log || true

      - name: Aggregate required verification gates
        id: aggregate
        if: always()
        env:
          FIXTURE_SERVER_OUTCOME: ${{ steps.fixture_server.outcome }}
          MCP_BOOTSTRAP_OUTCOME: ${{ steps.mcp_bootstrap.outcome }}
          HUB_UI_OUTCOME: ${{ steps.hub_ui.outcome }}
          SPORTS_UI_OUTCOME: ${{ steps.sports_ui.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for gate in FIXTURE_SERVER MCP_BOOTSTRAP HUB_UI SPORTS_UI PRODUCTION REGRESSION; do
            variable="${gate}_OUTCOME"
            outcome="${!variable}"
            echo "$gate: $outcome"
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required gates failed or were blocked."
            exit 1
          fi
          echo "All required gates passed with MCP-backed browser evidence."
