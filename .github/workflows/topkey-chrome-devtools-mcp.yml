name: TOPKEY Chrome DevTools MCP full UI smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["TOPKEY EdgeOne Git-provider readiness"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: topkey-chrome-devtools-mcp-v3
  cancel-in-progress: false

jobs:
  chrome-devtools-full-ui:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Chrome DevTools MCP – production UI smoke matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install official Chrome DevTools MCP CLI
        run: |
          npm install --global chrome-devtools-mcp@latest
          chrome-devtools --help

      - name: Start isolated headless Chrome through Chrome DevTools MCP
        run: |
          set -euo pipefail
          chrome-devtools start --headless --isolated --no-usage-statistics --workspace="$GITHUB_WORKSPACE"
          chrome-devtools status
          mkdir -p artifacts/chrome-devtools

      - name: Inspect production Hub and every sport workspace
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          routes=(
            "/"
            "/sports/vnext/index.html?sport=football&testlab=1"
            "/sports/vnext/index.html?sport=volleyball&testlab=1"
            "/sports/vnext/index.html?sport=running&testlab=1"
            "/sports/vnext/index.html?sport=handmade&testlab=1"
            "/sports/vnext/index.html?sport=shuttle&testlab=1"
            "/sports/vnext/index.html?sport=cooking&testlab=1"
            "/sports/badminton/index.html?testlab=1"
          )
          mkdir -p artifacts/chrome-devtools
          chrome-devtools list_pages --output-format=json | tee artifacts/chrome-devtools/pages-start.json
          for i in "${!routes[@]}"; do
            route="${routes[$i]}"
            url="$base$route"
            echo "===== ROUTE $route =====" | tee -a artifacts/chrome-devtools/route-audit.txt
            timeout 25s chrome-devtools navigate_page 1 --url "$url" | tee "artifacts/chrome-devtools/route-$i-navigation.txt"
            sleep 1
            timeout 20s chrome-devtools evaluate_script '() => { const app=document.querySelector("#app-shell"); const appWasHidden=app?.classList.contains("hidden"); app?.classList.remove("hidden"); const pages=[...document.querySelectorAll("#app-shell .page")]; const workspacePages=pages.map(p=>{const wasHidden=p.classList.contains("hidden");p.classList.remove("hidden");const card=p.querySelector(".card");const btn=p.querySelector("button,.btn");const field=p.querySelector("input,select,textarea");const th=p.querySelector("th");const cs=card?getComputedStyle(card):null;const row={id:p.id,card:!!card,cardBackground:cs?.backgroundColor||null,cardColor:cs?.color||null,cardBorderRadius:cs?.borderRadius||null,buttonBackground:btn?getComputedStyle(btn).backgroundColor:null,fieldBackground:field?getComputedStyle(field).backgroundColor:null,tableHeadBackground:th?getComputedStyle(th).backgroundColor:null};if(wasHidden)p.classList.add("hidden");return row;}); if(app){app.classList.remove("hidden");document.querySelector("#login-screen")?.classList.add("hidden");pages.forEach(p=>p.classList.toggle("hidden",p.id!=="page-overview"));} const result={url:location.href,title:document.title,readyState:document.readyState,viewport:{width:innerWidth,height:innerHeight},documentWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+2,visibleText:(document.body.innerText||"").slice(0,700),cards:document.querySelectorAll("[class*=card], [class*=tile], [role=button], .sport").length,buttons:document.querySelectorAll("button").length,inputs:document.querySelectorAll("input,select,textarea").length,brokenImages:[...document.images].filter(x=>!x.complete||x.naturalWidth===0).map(x=>x.src),stylesheets:[...document.styleSheets].map(x=>x.href).filter(Boolean),missingLabels:[...document.querySelectorAll("button,input,select,textarea")].filter(x=>!((x.innerText||x.getAttribute("aria-label")||x.labels?.[0]?.innerText||x.getAttribute("placeholder")||"").trim())).length,workspacePages}; const bad=workspacePages.filter(x=>x.card&&x.cardBackground!=="rgb(255, 255, 255)"); if(location.pathname!=="/"&&(workspacePages.length<11||bad.length))throw new Error("Workspace visual contract failed: "+JSON.stringify({pageCount:workspacePages.length,bad})); return JSON.stringify(result); }' --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/route-$i-dom.json"
            if [ "$i" != "0" ]; then
              if grep -Fq 'Error: Workspace visual contract failed' "artifacts/chrome-devtools/route-$i-dom.json"; then echo "Workspace style audit failed for $route"; exit 1; fi
              grep -Fq 'workspace-redesign-h218.css' "artifacts/chrome-devtools/route-$i-dom.json"
            fi
            timeout 15s chrome-devtools take_screenshot 1 --filePath "artifacts/chrome-devtools/route-$i-workspace.png" | tee "artifacts/chrome-devtools/route-$i-workspace-screenshot.txt"
            if [ "$i" = "0" ] || [ "$i" = "7" ]; then
              timeout 15s chrome-devtools list_console_messages 1 --output-format=json | tee "artifacts/chrome-devtools/route-$i-console.json" || echo "Console capture timed out" >> artifacts/chrome-devtools/diagnostics-warnings.txt
              timeout 15s chrome-devtools list_network_requests 1 --output-format=json | tee "artifacts/chrome-devtools/route-$i-network.json" || echo "Network capture timed out" >> artifacts/chrome-devtools/diagnostics-warnings.txt
            fi
            if [ "$i" = "0" ]; then
              timeout 15s chrome-devtools take_screenshot 1 --filePath "artifacts/chrome-devtools/hub-mobile-viewport.png" | tee "artifacts/chrome-devtools/hub-screenshot.txt" || echo "Screenshot capture timed out" >> artifacts/chrome-devtools/diagnostics-warnings.txt
            fi
          done

      - name: Full interaction audit – every sport tab and collapsible function card
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          routes=(
            "/sports/vnext/index.html?sport=football&testlab=1"
            "/sports/vnext/index.html?sport=volleyball&testlab=1"
            "/sports/vnext/index.html?sport=running&testlab=1"
            "/sports/vnext/index.html?sport=handmade&testlab=1"
            "/sports/vnext/index.html?sport=shuttle&testlab=1"
            "/sports/vnext/index.html?sport=cooking&testlab=1"
            "/sports/badminton/index.html?testlab=1"
          )
          tabs=(overview control teams schedule umpire live finance announcements audit health settings)
          for i in "${!routes[@]}"; do
            route="${routes[$i]}"
            echo "===== INTERACTION ROUTE $route =====" | tee -a artifacts/chrome-devtools/interaction-audit.txt
            timeout 25s chrome-devtools navigate_page 1 --url "$base$route" | tee "artifacts/chrome-devtools/interaction-$i-navigation.txt"
            sleep 2
            timeout 25s chrome-devtools evaluate_script 'async () => { const wait=ms=>new Promise(r=>setTimeout(r,ms)); const app=document.querySelector("#app-shell"); app?.classList.remove("hidden"); document.querySelector("#login-screen")?.classList.add("hidden"); document.querySelectorAll("#app-shell .page").forEach(p=>p.classList.remove("hidden")); await wait(500); const script=[...document.scripts].find(s=>s.src.includes("collapsible-panels-h141.js")); const cards=[...document.querySelectorAll("#app-shell .page .subcard")]; const candidates=cards.map(card=>({card,button:card.querySelector(":scope > .tk141-panel-toggle")})).filter(x=>x.button); let accordion={scriptLoaded:!!script,scriptUrl:script?.src||null,subcards:cards.length,foldableSubcards:candidates.length,test:"N/A"}; if(candidates.length){const {card,button}=candidates[0]; const before=button.getAttribute("aria-expanded"); button.click(); await wait(80); const collapsed=button.getAttribute("aria-expanded")==="false"&&card.classList.contains("tk141-panel-folded"); const closedText=button.textContent; button.click(); await wait(80); const expanded=button.getAttribute("aria-expanded")==="true"&&!card.classList.contains("tk141-panel-folded"); accordion={...accordion,before,collapsed,expanded,closedText,test:collapsed&&expanded?"PASS":"FAIL",panelId:card.id}; if(!collapsed||!expanded)throw new Error("Accordion interaction failed: "+JSON.stringify(accordion)); } if(!script)throw new Error("Collapsible script missing on route "+location.href); return JSON.stringify(accordion); }' --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/interaction-$i-accordion.json"
            grep -Fq '"scriptLoaded":true' "artifacts/chrome-devtools/interaction-$i-accordion.json"
            grep -Fq '"test":"PASS"' "artifacts/chrome-devtools/interaction-$i-accordion.json" || grep -Fq '"test":"N/A"' "artifacts/chrome-devtools/interaction-$i-accordion.json"
            for tab in "${tabs[@]}"; do
              timeout 15s chrome-devtools evaluate_script "async () => { const b=document.querySelector('[data-tab=\\\"$tab\\\"]'); if(!b)throw new Error('Missing tab: $tab'); b.click(); await new Promise(r=>setTimeout(r,180)); const active=[...document.querySelectorAll('#app-shell .page')].filter(p=>!p.classList.contains('hidden')); return JSON.stringify({tab:'$tab',activePages:active.map(p=>p.id),activeCount:active.length}); }" --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/interaction-$i-tab-$tab.json"
              grep -Fq '"activeCount":1' "artifacts/chrome-devtools/interaction-$i-tab-$tab.json"
              timeout 15s chrome-devtools take_screenshot 1 --filePath "artifacts/chrome-devtools/route-$i-tab-$tab.png" >/dev/null
            done
          done

      - name: Full interaction test – all tabs and collapsible cards on all 7 sports
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          routes=(
            "/sports/vnext/index.html?sport=football&testlab=1"
            "/sports/vnext/index.html?sport=volleyball&testlab=1"
            "/sports/vnext/index.html?sport=running&testlab=1"
            "/sports/vnext/index.html?sport=handmade&testlab=1"
            "/sports/vnext/index.html?sport=shuttle&testlab=1"
            "/sports/vnext/index.html?sport=cooking&testlab=1"
            "/sports/badminton/index.html?testlab=1"
          )
          mkdir -p artifacts/chrome-devtools/full-tabs
          for i in "${!routes[@]}"; do
            route="${routes[$i]}"
            echo "===== FULL INTERACTION $route =====" | tee -a artifacts/chrome-devtools/full-interaction.txt
            timeout 25s chrome-devtools navigate_page 1 --url "$base$route" >/dev/null
            sleep 2
            timeout 25s chrome-devtools evaluate_script 'async () => {
              const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
              const app=document.querySelector("#app-shell");
              app?.classList.remove("hidden");
              document.querySelector("#login-screen")?.classList.add("hidden");
              document.querySelectorAll("#app-shell .page").forEach(p=>p.classList.add("hidden"));
              const nav=[...document.querySelectorAll("#app-shell [data-tab]")];
              if(nav.length<11) throw new Error("Expected 11 navigation tabs; found "+nav.length);
              const tabResults=[];
              for(const button of nav){
                const tab=button.getAttribute("data-tab");
                button.click(); await wait(180);
                const page=document.getElementById("page-"+tab);
                if(!page) throw new Error("Missing feature page: "+tab);
                if(page.classList.contains("hidden")) throw new Error("Tab did not activate its page: "+tab);
                const visibleCards=[...page.querySelectorAll(".card,.subcard")].filter(el=>getComputedStyle(el).display!=="none").length;
                tabResults.push({tab,page:page.id,visibleCards});
                if(tab==="overview"){
                  const nested=[...page.querySelectorAll(".subcard[data-tk141-foldable=\"1\"] .tk141-panel-toggle")];
                  if(nested.length){
                    const toggle=nested[0], panel=toggle.closest(".subcard");
                    toggle.click(); await wait(50);
                    if(toggle.getAttribute("aria-expanded")!=="true"||panel.classList.contains("tk141-panel-folded")) throw new Error("Nested card failed to expand");
                    toggle.click(); await wait(50);
                    if(toggle.getAttribute("aria-expanded")!=="false"||!panel.classList.contains("tk141-panel-folded")) throw new Error("Nested card failed to collapse");
                    tabResults[tabResults.length-1].accordion="PASS";
                  }
                }
              }
              const allToggles=[...document.querySelectorAll("#app-shell .tk141-panel-toggle")];
              const foldable=[...document.querySelectorAll("#app-shell .subcard[data-tk141-foldable=\"1\"]")];
              let accordion="N/A – no eligible nested subcard in current DOM";
              if(foldable.length){
                const panel=foldable[0],toggle=panel.querySelector(":scope > .tk141-panel-toggle");
                if(!toggle) throw new Error("Foldable subcard has no toggle control");
                const initial=panel.classList.contains("tk141-panel-folded");
                toggle.click(); await wait(50);
                if(panel.classList.contains("tk141-panel-folded")===initial) throw new Error("Accordion click did not change state");
                toggle.click(); await wait(50);
                if(panel.classList.contains("tk141-panel-folded")!==initial) throw new Error("Accordion could not restore original state");
                accordion="PASS";
              }
              return JSON.stringify({route:location.href,tabs:tabResults.length,tabResults,foldableSubcards:foldable.length,toggleControls:allToggles.length,accordion});
            }' --pageId 1 --output-format=json | tee "artifacts/chrome-devtools/full-tabs/sport-$i-interactions.json"
            timeout 15s chrome-devtools take_screenshot 1 --filePath "artifacts/chrome-devtools/full-tabs/sport-$i-all-tabs.png" >/dev/null
          done
          echo "PASS: all seven sports expose and activate all 11 feature tabs; accordion interactions checked wherever eligible subcards exist." | tee -a artifacts/chrome-devtools/full-interaction.txt

      - name: Verify all production route HTTP statuses and required static assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          paths=(
            "/"
            "/sports/vnext/index.html?sport=football&testlab=1"
            "/sports/vnext/index.html?sport=volleyball&testlab=1"
            "/sports/vnext/index.html?sport=running&testlab=1"
            "/sports/vnext/index.html?sport=handmade&testlab=1"
            "/sports/vnext/index.html?sport=shuttle&testlab=1"
            "/sports/vnext/index.html?sport=cooking&testlab=1"
            "/sports/badminton/index.html?testlab=1"
            "/sports/vnext/workspace-redesign-h218.css"
            "/sports/badminton/workspace-redesign-h218.css"
          )
          failed=0
          for path in "${paths[@]}"; do
            code="$(curl --silent --show-error --location --max-time 25 -o /dev/null -w '%{http_code}' "$base$path" || true)"
            printf '%s %s\n' "$code" "$path" | tee -a artifacts/chrome-devtools/http-status.txt
            if [ "$code" != "200" ]; then failed=1; fi
          done
          test "$failed" = "0"

      - name: Run TOPKEY source regression suite
        shell: bash
        run: |
          set -euo pipefail
          node topkey/tests/hub-readable-h216.test.cjs
          node topkey/tests/sport-contrast-h217.test.cjs
          node topkey/tests/sport-workspace-redesign-h218.test.cjs
          node topkey/tests/hub-readable-h216.test.cjs
          node topkey/tests/sport-workspaces-ux-h214.test.cjs
          node topkey/tests/sport-themes-h132.test.cjs
          node topkey/tests/badminton-dashboard-smooth-h129.test.cjs
          node topkey/tests/hub-sidebar-full-patch-h130.test.cjs
          node topkey/tests/short-public-links-h136.test.cjs

      - name: Upload Chrome DevTools screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topkey-chrome-devtools-mcp-ui-audit
          path: artifacts/chrome-devtools/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Chrome DevTools MCP daemon
        if: always()
        run: chrome-devtools stop || true
