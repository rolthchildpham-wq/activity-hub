name: H135 sharing UI source checks
on:
  push:
    branches:
      - fix/h135-sharing-contrast-audit
  pull_request:
    paths:
      - 'topkey/sports/vnext/index.html'
      - 'topkey/sports/vnext/share-contrast-h135.css'
      - 'topkey/tests/h135_sharing_contract.cjs'
jobs:
  sharing-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node topkey/tests/h135_sharing_contract.cjs
