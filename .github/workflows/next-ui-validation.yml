name: TOPKEY Next UI validation (no deployment)
on:
  push:
    branches:
      - main
      - rebuild/sports-hub-ecc-unified
    paths:
      - 'next-ui/**'
      - '.github/workflows/next-ui-validation.yml'
      - 'scripts/stage-edgeone-next.mjs'
      - 'scripts/tests/stage-edgeone-next.test.mjs'
  pull_request:
    paths:
      - 'scripts/stage-edgeone-next.mjs'
      - 'scripts/tests/stage-edgeone-next.test.mjs'
      - 'next-ui/**'
      - '.github/workflows/next-ui-validation.yml'
permissions:
  contents: read
concurrency:
  group: next-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: next-ui-npm-${{ runner.os }}-${{ hashFiles('next-ui/package.json') }}
          restore-keys: next-ui-npm-${{ runner.os }}-
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Synchronize SvelteKit types
        run: npx svelte-kit sync
      - name: Svelte and TypeScript check
        run: npm run check
      - name: Domain and security contract tests
        run: npm test
      - name: Build static SPA
        run: npm run build
      - name: Stage legacy and Next in a single EdgeOne artifact
        run: node ../scripts/stage-edgeone-next.mjs
      - name: Validate staged /next/ routes and unchanged legacy modules
        run: node --test ../scripts/tests/stage-edgeone-next.test.mjs
      - name: Save test-only EdgeOne site bundle
        uses: actions/upload-artifact@v4
        with:
          name: topkey-edgeone-composed-site
          path: dist-edgeone/
          retention-days: 7


  e2e:
    name: e2e
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-ui
    env:
      TOPKEY_TEST_TID: ${{ secrets.TOPKEY_TEST_TID }}
      TOPKEY_TEST_SPORT: ${{ vars.TOPKEY_TEST_SPORT }}
      TOPKEY_ADMIN_STORAGE_B64: ${{ secrets.TOPKEY_ADMIN_STORAGE_B64 }}
      TOPKEY_REFEREE_STORAGE_B64: ${{ secrets.TOPKEY_REFEREE_STORAGE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: next-ui-npm-${{ runner.os }}-${{ hashFiles('next-ui/package.json') }}
          restore-keys: next-ui-npm-${{ runner.os }}-
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: next-ui-playwright-${{ runner.os }}-${{ hashFiles('next-ui/package.json') }}
      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Prepare optional TEST LAB profiles
        shell: bash
        run: |
          if [ -n "$TOPKEY_ADMIN_STORAGE_B64" ]; then
            printf '%s' "$TOPKEY_ADMIN_STORAGE_B64" | base64 -d > "$RUNNER_TEMP/topkey-admin-state.json"
            echo "TOPKEY_ADMIN_STORAGE_STATE=$RUNNER_TEMP/topkey-admin-state.json" >> "$GITHUB_ENV"
          fi
          if [ -n "$TOPKEY_REFEREE_STORAGE_B64" ]; then
            printf '%s' "$TOPKEY_REFEREE_STORAGE_B64" | base64 -d > "$RUNNER_TEMP/topkey-referee-state.json"
            echo "TOPKEY_REFEREE_STORAGE_STATE=$RUNNER_TEMP/topkey-referee-state.json" >> "$GITHUB_ENV"
          fi
      - name: Run desktop and mobile read-only E2E
        run: npm run test:e2e -- --project=desktop --project=mobile-chromium
      - name: Upload public layout screenshots and navigation measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-ui-public-layout-images
          path: next-ui/public-visuals/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload visual evidence when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-ui-visual-evidence
          path: |
            next-ui/test-results/
            next-ui/playwright-report/
          retention-days: 7
# This workflow never deploys EdgeOne or changes Firebase production rules/data.
