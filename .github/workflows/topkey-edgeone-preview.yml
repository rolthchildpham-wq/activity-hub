name: TOPKEY EdgeOne Git-provider readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topkey-edgeone-preview.yml'
      - 'topkey/index.html'
      - 'topkey/release.json'
      - 'topkey/build.json'
      - 'topkey/edgeone.json'
      - 'topkey/build.json'
      - 'topkey/release-runtime.js'
      - 'topkey/sports/vnext/workspace-redesign-h218.css'
      - 'topkey/sports/badminton/workspace-redesign-h218.css'
      - 'topkey/tests/sport-workspace-redesign-h218.test.cjs'
      - 'topkey/hub-contrast-readable-h216.css'
      - 'topkey/hub-dashboard-reference-h219.css'
      - 'topkey/tests/hub-dashboard-h219.test.cjs'
      - '.github/workflows/topkey-chrome-devtools-mcp.yml'
      - 'topkey/sports/vnext/contrast-global-h217.css'
      - 'topkey/sports/badminton/contrast-global-h217.css'
      - 'topkey/sports-hub-bi.css'
      - 'topkey/executive-dashboard.css'
      - 'topkey/executive-dashboard.js'
      - 'topkey/sports/badminton/index.html'
      - 'topkey/sports/badminton/ux-responsive-h214.css'
      - 'topkey/sports/badminton/contrast-awards-h215.css'
      - 'topkey/sports/diy-vlog/**'
      - 'topkey/tests/vlog-*.test.cjs'
      - 'topkey/sports/vnext/index.html'
      - 'topkey/sports/vnext/ux-responsive-h214.css'
      - 'topkey/sports/vnext/contrast-awards-h215.css'
      - 'topkey/tests/sport-workspaces-ux-h214.test.cjs'
      - 'topkey/l/index.html'
      - 'topkey/sports/vnext/h97-vnext.bundle.js'
      - 'topkey/tests/short-public-links-h136.test.cjs'
      - 'topkey/sports/vnext/sport-identities-h132.css'
      - 'topkey/sports/vnext/sport-identities-h132.js'
      - 'topkey/tests/sport-themes-h132.test.cjs'
      - 'topkey/sports/badminton/fast-start-h124.js'
      - 'topkey/tests/badminton-fast-start-h124.test.cjs'
      - 'topkey/sports/badminton/production-loader.js'
      - 'topkey/sports/badminton/upgrade122-hotfix55.js'
      - 'topkey/sports/badminton/upgrade122-hotfix76.js'
      - 'topkey/tests/badminton-report-polling-h135.test.cjs'
      - 'topkey/sports/badminton/dashboard-smooth-h129.css'
      - 'topkey/sports/badminton/dashboard-smooth-h129.js'
      - 'topkey/sports/badminton/tab-perf-h133.js'
      - 'topkey/tests/badminton-rapid-tabs-h133.test.cjs'
      - 'topkey/tests/badminton-dashboard-smooth-h129.test.cjs'
      - 'topkey/hub-compact-h130.css'
      - 'topkey/hub-layout-h209.css'
      - 'topkey/hub-compact-h130.js'
      - 'topkey/sports/badminton/sidebar-collapse-h130.css'
      - 'topkey/sports/badminton/sidebar-collapse-h130.js'
      - 'topkey/tests/hub-sidebar-full-patch-h130.test.cjs'
      - 'topkey/sports/badminton/upgrade122-hotfix5.js'
      - 'topkey/tests/badminton-no-autoheal-h128.test.cjs'
      - 'topkey/sports/badminton/perf-diagnostics-h125.js'

permissions:
  contents: read

concurrency:
  group: topkey-edgeone-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate static website assets
        shell: bash
        run: |
          set -euo pipefail
          test -f topkey/index.html
          test -f topkey/sports/badminton/index.html
          test -f topkey/topkey-shared-auth.js
          node --check topkey/topkey-shared-auth.js
          node --check topkey/sports/badminton/production-loader.js
          node topkey/tests/auth-profile-pending.test.cjs
          node --check topkey/sports/badminton/fast-start-h124.js
          node --check topkey/sports/badminton/production-loader.js
          node --check topkey/sports/badminton/perf-diagnostics-h125.js
          node topkey/tests/badminton-fast-start-h124.test.cjs
          node topkey/tests/badminton-no-autoheal-h128.test.cjs
          node --check topkey/sports/badminton/dashboard-smooth-h129.js
          node topkey/tests/badminton-dashboard-smooth-h129.test.cjs
          node --check topkey/sports/badminton/tab-perf-h133.js
          node topkey/tests/badminton-rapid-tabs-h133.test.cjs
          node --check topkey/sports/badminton/upgrade122-hotfix55.js
          node --check topkey/sports/badminton/upgrade122-hotfix76.js
          node topkey/tests/badminton-report-polling-h135.test.cjs
          node topkey/tests/short-public-links-h136.test.cjs
          node --check topkey/tests/vlog-create-entry-save.test.cjs
          node topkey/tests/vlog-create-entry-save.test.cjs
          node --check topkey/hub-compact-h130.js
          node --check topkey/sports/badminton/sidebar-collapse-h130.js
          node topkey/tests/hub-sidebar-full-patch-h130.test.cjs
          node --check topkey/sports/vnext/sport-identities-h132.js
          node topkey/tests/sport-themes-h132.test.cjs
          node topkey/tests/sport-workspaces-ux-h214.test.cjs
          node topkey/tests/sport-workspace-redesign-h218.test.cjs
          node --check topkey/executive-dashboard.js
          node topkey/tests/hub-dashboard-h219.test.cjs
          node topkey/tests/edgeone-host-redirect.test.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('topkey')
          for f in ('edgeone.json','firebase.json','firebase.database.rules.json'):
              json.loads((root/f).read_text(encoding='utf-8'))
          print('TOPKEY static artifacts and auth regression validated')
          PY
      - name: Trigger EdgeOne deployment if configured
        shell: bash
        env:
          EDGEONE_DEPLOY_HOOK: ${{ secrets.EDGEONE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${EDGEONE_DEPLOY_HOOK}" ]; then
            echo "::warning::EdgeOne has NOT been deployed. Configure repository secret EDGEONE_DEPLOY_HOOK from the EdgeOne Pages project's Deploy Hook settings."
            echo "### EdgeOne deployment NOT triggered" >> "$GITHUB_STEP_SUMMARY"
            echo "No EDGEONE_DEPLOY_HOOK repository secret. GitHub source is newer than live EdgeOne." >> "$GITHUB_STEP_SUMMARY"
          else
            curl --fail --silent --show-error --max-time 35 --request POST "${EDGEONE_DEPLOY_HOOK}" --output /dev/null
            echo "### EdgeOne deploy hook submitted" >> "$GITHUB_STEP_SUMMARY"
            echo "EdgeOne must still finish its own production deployment; check EdgeOne build history to confirm." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit live EdgeOne dashboard version
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --max-time 22 --location "https://topkey-activity-management.edgeone.dev/index.html" -o /tmp/topkey-edgeone-live.html; then
            echo "::warning::Could not fetch live EdgeOne website; deployment status is unverified."
            exit 0
          fi
          if grep -q 'sports-hub-bi.css' /tmp/topkey-edgeone-live.html; then
            echo "Live EdgeOne HTML contains the redesigned Hub stylesheet." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Live EdgeOne is still serving the OLD Hub version; redeploy the latest GitHub main branch in EdgeOne Production."
            echo "**Live EdgeOne is stale**: index.html does not contain sports-hub-bi.css." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit live badminton fast-start assets
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            html_file=/tmp/topkey-badminton-live.html
            js_file=/tmp/topkey-badminton-h124.js
            if curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/index.html" -o "$html_file" 2>/dev/null &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/fast-start-h124.js" -o "$js_file" 2>/dev/null &&
               grep -Fq "fast-start-h124.js?v=h126-startup-20261113" "$html_file" &&
               grep -Fq "topkey-shared-auth.js?v=h127-auth-visual-stability-20261113" "$html_file" &&
               grep -Fq "perf-diagnostics-h125.js?v=h134-20261113" "$html_file" &&
               grep -Fq "tab-perf-h133.js?v=h133-20261113" "$html_file" &&
               grep -Fq "dashboard-smooth-h129.css?v=h129-20261113" "$html_file" &&
               grep -Fq "sidebar-collapse-h130.css?v=h130-20261113" "$html_file" &&
               grep -Fq "sidebar-collapse-h130.js?v=h130-20261113" "$html_file" &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/sidebar-collapse-h130.js" -o /tmp/tk-sidebar-h130.js 2>/dev/null &&
               grep -Fq "topkey_badminton_sidebar_collapsed_h130" /tmp/tk-sidebar-h130.js &&
               grep -Fq "dashboard-smooth-h129.js?v=h129-20261113" "$html_file" &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/dashboard-smooth-h129.js" -o /tmp/tk-dashboard-h129.js 2>/dev/null &&
               grep -Fq "PERSISTENT_SHELL_SINGLE_VISIBLE_TAB_PAINT" /tmp/tk-dashboard-h129.js &&
               grep -Fq "production-loader.js?v=tourney-lifecycle-20261117-r1" "$html_file" &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/production-loader.js" -o /tmp/tk-loader-h135.js 2>/dev/null &&
               grep -Fq "upgrade122-hotfix55.js?v=h135-event-reports-20261113" /tmp/tk-loader-h135.js &&
               grep -Fq "upgrade122-hotfix76.js?v=h135-event-reports-20261113" /tmp/tk-loader-h135.js &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/production-loader.js" -o /tmp/tk-loader-h128.js 2>/dev/null &&
               grep -Fq "upgrade122-hotfix5.js?v=h128-no-auto-reload-20261113" /tmp/tk-loader-h128.js &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/upgrade122-hotfix5.js" -o /tmp/tk-selfheal-h128.js 2>/dev/null &&
               ! grep -q "location.replace(" /tmp/tk-selfheal-h128.js &&
               grep -q "AFTER_LOGIN_HOUSEKEEPING_NONBLOCKING" "$js_file" &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/perf-diagnostics-h125.js" -o /tmp/tk-perf-h125.js 2>/dev/null &&
               grep -q 'TopkeyBadmintonPerf125' /tmp/tk-perf-h125.js; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -eq 1 ]; then
            echo "### Live Badminton H129 stable dashboard is available on EdgeOne." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Live Badminton H129 stable dashboard not verified. Confirm EdgeOne Production deployment and CDN propagation."
            echo "### Live Badminton H129 stable dashboard not yet verified." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit live H130 Hub compact assets
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/index.html" -o /tmp/tk-hub-h130.html 2>/dev/null &&
               grep -Fq "hub-compact-h130.css?v=h130-20261113" /tmp/tk-hub-h130.html &&
               grep -Fq "hub-compact-h130.js?v=h130-20261113" /tmp/tk-hub-h130.html &&
               curl --fail --silent --show-error --max-time 15 --location "https://topkey-activity-management.edgeone.dev/hub-compact-h130.js" -o /tmp/tk-hub-js-h130.js 2>/dev/null &&
               grep -Fq "Thiết kế bởi BacPham" /tmp/tk-hub-js-h130.js; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -eq 1 ]; then
            echo "### Live Hub compact H130 verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Live Hub H130 assets not verified. Confirm EdgeOne deployment and CDN propagation."
          fi
      - name: Audit live H132 six-sport dashboard and badminton no-flash boot
        shell: bash
        run: |
          set -euo pipefail
          good=0
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --max-time 12 --location "https://topkey-activity-management.edgeone.dev/sports/vnext/index.html?sport=football" -o /tmp/tk-h132-vnext.html 2>/dev/null &&
               grep -Fq "sport-identities-h132.css?v=h132-20261113" /tmp/tk-h132-vnext.html &&
               grep -Fq "tk132-sport-prepaint" /tmp/tk-h132-vnext.html &&
               curl --fail --silent --show-error --max-time 12 --location "https://topkey-activity-management.edgeone.dev/sports/vnext/sport-identities-h132.css" -o /tmp/tk-h132-theme.css 2>/dev/null &&
               grep -Fq 'data-tk-sport="cooking"' /tmp/tk-h132-theme.css &&
               curl --fail --silent --show-error --max-time 12 --location "https://topkey-activity-management.edgeone.dev/sports/badminton/index.html" -o /tmp/tk-h132-badminton.html 2>/dev/null &&
               grep -Fq '<body class="tk-smooth-admin">' /tmp/tk-h132-badminton.html; then
              good=1
              break
            fi
            sleep 5
          done
          if [ "$good" -eq 1 ]; then
            echo "### Live H132 badminton first-paint and six-sport UI verified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::H132 not verified on EdgeOne live domain; GitHub success alone does not mean Production is active."
            echo "### Live H132 deploy could not be confirmed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit live compact share-link entry
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --location --max-time 12 "https://topkey-activity-management.edgeone.dev/l/" -o /tmp/tk-shortlinks-h136.html 2>/dev/null &&
               grep -Fq "TopkeyShortRedirect" /tmp/tk-shortlinks-h136.html &&
               curl --fail --silent --show-error --location --max-time 12 "https://topkey-activity-management.edgeone.dev/sports/vnext/index.html?sport=volleyball" -o /tmp/tk-vnext-shortlinks-h136.html 2>/dev/null &&
               grep -Fq "h97-vnext.bundle.js?v=h136-short-share-20261114" /tmp/tk-vnext-shortlinks-h136.html; then
              found=1
              break
            fi
            sleep 5
          done
          if [ "$found" -eq 1 ]; then
            echo "### H136 short public link route verified on EdgeOne." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::H136 compact route not verified on EdgeOne. Confirm deployment and URL host."
          fi
      - name: Diagnose and verify live H210 Hub route
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          found=""
          html_file=/tmp/topkey-h210-live.html
          for attempt in $(seq 1 18); do
            code="$(curl --silent --show-error --max-time 20 --location --output "$html_file" --write-out '%{http_code}' "$base/?__h210_probe=$attempt" || true)"
            title="$(grep -Eo '<title>[^<]+' "$html_file" 2>/dev/null | head -1 || true)"
            has_nav=0; has_art=0; has_css=0
            grep -Fq 'tk210-nav' "$html_file" 2>/dev/null && has_nav=1 || true
            grep -Fq 'tk210-hero-art' "$html_file" 2>/dev/null && has_art=1 || true
            grep -Fq 'hub-layout-h209.css?v=h210-reference-layout-20261124' "$html_file" 2>/dev/null && has_css=1 || true
            echo "H210 live attempt=$attempt HTTP=$code title=${title:-unknown} nav=$has_nav hero=$has_art css=$has_css"
            if [ "$code" = "200" ] && [ "$has_nav" = "1" ] && [ "$has_art" = "1" ] && [ "$has_css" = "1" ]; then
              found=1
              break
            fi
            sleep 10
          done
          if [ "$found" != "1" ]; then
            echo "::error::EdgeOne root is reachable but has not served H210 markup after 180 seconds. Check EdgeOne Production deployment source/root directory and deployment history."
            exit 1
          fi
          css_code="$(curl --silent --show-error --max-time 20 --location --output /tmp/topkey-h210-live.css --write-out '%{http_code}' "$base/hub-layout-h209.css?__h210_probe=1" || true)"
          echo "H210 stylesheet HTTP=$css_code"
          test "$css_code" = "200"
          grep -Fq '.tk210-nav' /tmp/topkey-h210-live.css
          grep -Fq '.tk210-hero-art' /tmp/topkey-h210-live.css
          echo "### Live H210 Hub HTML and stylesheet verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the complete H218 production bundle
        shell: bash
        run: |
          set -euo pipefail
          base="https://topkey-activity-management.edgeone.dev"
          ok=0
          for attempt in $(seq 1 18); do
            stamp="__h218_bundle=${attempt}_${GITHUB_RUN_ID}"
            release_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-release.json --write-out '%{http_code}' "$base/release.json?$stamp" || true)"
            root_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-root-build.json --write-out '%{http_code}' "$base/build.json?$stamp" || true)"
            vnext_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-vnext-build.json --write-out '%{http_code}' "$base/sports/vnext/build.json?$stamp" || true)"
            badminton_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-badminton-build.json --write-out '%{http_code}' "$base/sports/badminton/build.json?$stamp" || true)"
            runtime_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-runtime.js --write-out '%{http_code}' "$base/release-runtime.js?$stamp" || true)"
            hub_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-hub.html --write-out '%{http_code}' "$base/?$stamp" || true)"
            vnext_html_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-vnext.html --write-out '%{http_code}' "$base/sports/vnext/index.html?$stamp" || true)"
            badminton_html_code="$(curl --silent --show-error --max-time 12 --location --output /tmp/tk-h218-badminton.html --write-out '%{http_code}' "$base/sports/badminton/index.html?$stamp" || true)"
            vnext_css_code="$(curl --silent --show-error --max-time 12 --location --output /dev/null --write-out '%{http_code}' "$base/sports/vnext/workspace-redesign-h218.css?$stamp" || true)"
            badminton_css_code="$(curl --silent --show-error --max-time 12 --location --output /dev/null --write-out '%{http_code}' "$base/sports/badminton/workspace-redesign-h218.css?$stamp" || true)"
            echo "H218 bundle attempt=$attempt release=$release_code root=$root_code vnext=$vnext_code badminton=$badminton_code runtime=$runtime_code hub=$hub_code vnext_html=$vnext_html_code badminton_html=$badminton_html_code vnext_css=$vnext_css_code badminton_css=$badminton_css_code"
            if [ "$release_code" = "200" ] && [ "$root_code" = "200" ] && [ "$vnext_code" = "200" ] && [ "$badminton_code" = "200" ] && [ "$runtime_code" = "200" ] && [ "$hub_code" = "200" ] && [ "$vnext_html_code" = "200" ] && [ "$badminton_html_code" = "200" ] && [ "$vnext_css_code" = "200" ] && [ "$badminton_css_code" = "200" ] &&
               grep -Fq '"releaseId": "H218"' /tmp/tk-h218-release.json &&
               grep -Fq '"cacheTag": "h218-sports-redesign-20261124"' /tmp/tk-h218-root-build.json &&
               grep -Fq '"cacheTag": "h218-sports-redesign-20261124"' /tmp/tk-h218-vnext-build.json &&
               grep -Fq '"cacheTag": "h218-sports-redesign-20261124"' /tmp/tk-h218-badminton-build.json &&
               grep -Fq 'h218-sports-redesign-20261124' /tmp/tk-h218-runtime.js &&
               grep -Fq 'workspace-redesign-h218.css?v=h218-sports-redesign-20261124' /tmp/tk-h218-vnext.html &&
               grep -Fq 'workspace-redesign-h218.css?v=h218-sports-redesign-20261124' /tmp/tk-h218-badminton.html &&
               grep -Fq 'release-runtime.js?v=h218-sports-redesign-20261124' /tmp/tk-h218-hub.html; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" != "1" ]; then
            echo "::error::The complete H218 release bundle did not propagate to EdgeOne. Check project root directory (topkey), deployment history and CDN propagation; do not run visual acceptance against a mixed release."
            exit 1
          fi
          echo "### Complete H218 production bundle verified: Hub, all three manifests, runtime, both workspace HTML files and both CSS assets." >> "$GITHUB_STEP_SUMMARY"
      - name: Document EdgeOne release settings
        shell: bash
        env:
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          {
            echo "## TOPKEY checked; EdgeOne deployment is triggered only when EDGEONE_DEPLOY_HOOK is configured"
            echo ""
            echo "The existing EdgeOne project \`topkey-activity-management\` is a GitHub-provider project."
            echo "Its CLI rejects folder/ZIP upload; the GitHub integration in EdgeOne must be configured."
            echo ""
            echo "Project name variable: \`${EDGEONE_PROJECT_NAME:-not-set}\`."
            echo "Expected GitHub repository: \`rolthchildpham-wq/activity-hub\`."
            echo "Expected branch: \`main\`."
            echo "Site root directory: \`topkey\`."
            echo "Output directory relative to root: \`.\`."
            echo "Framework preset: \`Other/Static\`; no build command."
            echo ""
            echo "Go to EdgeOne Makers > project > Settings > Build and Deployment, confirm repo and settings, then request preview redeploy in EdgeOne."
            echo ""
            echo "**This workflow validates source and optionally triggers the EdgeOne deploy hook. It never changes Firebase Rules.**"
          } >> "$GITHUB_STEP_SUMMARY"
