name: TOPKEY isolated Vlog candidate gate
on:
  push:
    branches:
      - fix/vlog-main-isolated-candidate-20261115
  pull_request:
    paths:
      - 'topkey/index.html'
      - 'topkey/sports/diy-vlog/**'
      - 'topkey/firebase.database.rules.json'
      - 'topkey/tests/vlog-*.test.cjs'
      - 'topkey/tests/vlog-emulator.firebase.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax
        run: node --check topkey/sports/diy-vlog/tiktok-automation.js
      - name: Vlog isolated entrypoint contract
        run: node topkey/tests/vlog-main-isolation.test.cjs
      - name: Install Firebase emulator test dependencies
        working-directory: topkey/tests
        run: |
          cp vlog-rules-package.json package.json
          npm install --no-audit --no-fund
      - name: Firebase emulator role and validation matrix
        working-directory: topkey
        run: |
          ./tests/node_modules/.bin/firebase emulators:exec --project demo-topkey-vlog --config firebase.vlog-emulator.json --only database "node tests/vlog-rules-emulator.test.cjs"
