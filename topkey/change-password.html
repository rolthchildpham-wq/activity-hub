<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071426"><title>TOPKEY · Đổi mật khẩu</title>

<style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#eaf4ff;font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#0d253b;border:1px solid #285677;border-radius:18px;padding:22px;margin-top:40px}.brand{display:flex;align-items:center;gap:16px}.brand img{width:160px;max-width:38vw;height:auto;display:block}.muted{color:#9eb2c8}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#b7c9da;margin-bottom:6px}input{width:100%;background:#061827;color:#fff;border:1px solid #38617d;border-radius:10px;padding:12px}.btn{display:inline-block;background:#153653;color:#fff;border:1px solid #35698f;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}.btn.ok{background:#07966b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.notice{border-radius:10px;padding:11px;background:#132f48;border:1px solid #315f80;margin-top:12px}.err{background:#531a26;border-color:#a63e59}.okmsg{background:#0c4138;border-color:#168b70}@media(max-width:620px){.brand{align-items:flex-start}.brand img{width:120px}.wrap{padding:14px}.card{padding:16px;margin-top:18px}}</style><link rel="stylesheet" href="./upgrade30.css?v=u122h123-20261111"></head><body>
<main class="wrap"><div class="card"><div class="brand"><img src="./assets/topkey-logo-4k.png?v=u122h123-20261111" alt="TOPKEY"><div><div style="font-weight:900;font-size:22px">🔐 ĐỔI MẬT KHẨU TÀI KHOẢN</div><div class="muted">Dành cho tài khoản đã được ADMIN cấp.</div></div></div>
<form id="changeForm" style="margin-top:18px"><div class="field"><label>Email tài khoản</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Mật khẩu hiện tại</label><input id="currentPassword" type="password" required autocomplete="current-password"></div><div class="field"><label>Mật khẩu mới</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Nhập lại mật khẩu mới</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="row"><button class="btn ok" type="submit">🔑 Đổi mật khẩu</button><a class="btn" href="./index.html">← Về Sports Hub</a></div></form><div id="msg" class="notice">Mật khẩu mới tối thiểu 8 ký tự. Hệ thống sẽ xác thực lại bằng mật khẩu hiện tại trước khi đổi.</div></div></main>
<script src="./upgrade30.js?v=u122h123-20261111"></script><script>(()=>{const CFG={apiKey:'AIzaSyBSr7buP3bMf6HTg_YDWH_Xk5aNhyvfSRg',authDomain:'topkey-badminton.firebaseapp.com',projectId:'topkey-badminton',storageBucket:'topkey-badminton.firebasestorage.app',messagingSenderId:'907878800245',appId:'1:907878800245:web:aa77e4846656a0ba84913c'};if(!firebase.apps.length)firebase.initializeApp(CFG);const auth=firebase.auth(),$=id=>document.getElementById(id),msg=(t,e=false)=>{$('msg').textContent=t;$('msg').className='notice '+(e?'err':'okmsg')};$('changeForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),oldPw=$('currentPassword').value,newPw=$('newPassword').value,confirmPw=$('confirmPassword').value;if(newPw.length<8)return msg('Mật khẩu mới phải có ít nhất 8 ký tự.',true);if(newPw!==confirmPw)return msg('Hai lần nhập mật khẩu mới không khớp.',true);if(oldPw===newPw)return msg('Mật khẩu mới phải khác mật khẩu hiện tại.',true);const btn=e.submitter;btn.disabled=true;try{await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);await auth.signOut().catch(()=>{});const cred=await auth.signInWithEmailAndPassword(email,oldPw);await cred.user.updatePassword(newPw);await auth.signOut();$('changeForm').reset();msg('✓ Đổi mật khẩu thành công. Hãy quay về Hub và đăng nhập bằng mật khẩu mới.');}catch(err){let t='Không thể đổi mật khẩu.';if(['auth/wrong-password','auth/invalid-credential','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code))t='Email hoặc mật khẩu hiện tại không đúng.';else if(err.code==='auth/weak-password')t='Mật khẩu mới chưa đủ mạnh.';else if(err.code==='auth/too-many-requests')t='Thử quá nhiều lần. Vui lòng thử lại sau.';else t+=' '+(err.message||'');msg(t,true)}finally{btn.disabled=false}}})();</script><script src="./topkey-dynamic-i18n.js?v=u122h123-20261111" defer></script></body></html>
