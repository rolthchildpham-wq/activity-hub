<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b2932">
<title>TOPKEY · Liên kết giải đấu</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf5f2;color:#163c32;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
main{max-width:520px;width:100%;background:#fff;border:1px solid #d6e5dd;border-radius:18px;padding:26px;box-shadow:0 12px 40px #173c2d14}
h1{margin:0 0 8px;font-size:23px;line-height:1.35}p{margin:10px 0 18px;color:#355e53}a{display:inline-block;margin:6px 8px 6px 0;background:#0d755b;color:white;font-weight:700;padding:12px 16px;border-radius:10px;text-decoration:none;min-height:44px}a.secondary{background:#dcebe5;color:#194538}small{display:block;color:#4b675d;margin-top:14px}#open-target[hidden]{display:none!important}
</style>
<script>
(function(){
"use strict";
const sports={b:"badminton",f:"football",v:"volleyball",r:"running",h:"handmade",s:"shuttle",c:"cooking"};
const modes={v:"spectator",r:"register",spectator:"spectator",register:"register"};
const qs=new URLSearchParams(location.search);
const sport=sports[qs.get("s")||""],mode=modes[location.hash.substring(1)]||"";
const tid=qs.get("t")||"",token=qs.get("k")||"";
const valid=value=>/^[a-zA-Z0-9_-]{1,100}$/.test(value);
let url=null;
if(sport&&mode&&valid(tid)&&(!token||valid(token))){
 url=new URL(sport==="badminton"?"../sports/badminton/index.html":"../sports/vnext/index.html",location.href);
 if(sport!=="badminton")url.searchParams.set("sport",sport);
 url.searchParams.set("tid",tid);
 if(token&&mode==="register")url.searchParams.set("reg",token);
 url.hash=mode;
}
const destination=url?.toString()||"";
window.TopkeyShortRedirect=destination;
document.addEventListener("DOMContentLoaded",()=>{
 const message=document.getElementById("message");
 const button=document.getElementById("open-target");
 if(!destination){message.textContent="Liên kết không hợp lệ hoặc đã thiếu thông tin. Vui lòng xin QR/link mới.";return}
 button.href=destination;
 button.hidden=false;
 message.textContent="Đang chuyển đến màn hình giải đấu. Nếu trình duyệt di động không tự mở, hãy bấm nút bên dưới.";
 // Keep a manual action available if navigation is blocked by a browser, SW, or WebView.
 setTimeout(()=>{if(document.visibilityState!=="hidden")message.textContent="Không tự chuyển trang? Nhấn ‘Mở giải đấu’ bên dưới để tiếp tục.";},1800);
 try{location.replace(destination)}catch(error){message.textContent="Trình duyệt chặn chuyển trang. Hãy bấm ‘Mở giải đấu’.";}
},{once:true});
})();
</script>
</head>
<body>
<main>
<h1>TOPKEY · Liên kết giải đấu</h1>
<p id="message" role="status">Đang kiểm tra đường dẫn…</p>
<a id="open-target" href="#" hidden>Mở giải đấu</a>
<a class="secondary" href="../index.html">Về TOPKEY Sports Hub</a>
<small>Nếu liên kết không hợp lệ, hãy yêu cầu ban tổ chức gửi lại QR hoặc đường dẫn. Link công khai không yêu cầu đăng nhập để xem.</small>
</main>
</body>
</html>
